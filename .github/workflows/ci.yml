name: CI
on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - run: gofmt -l . | tee /tmp/fmt.out && test ! -s /tmp/fmt.out
      - run: go vet ./...

  compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.18", "1.23"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: ${{ matrix.go-version }} }
      - run: go build ./...

  ci:
    runs-on: ubuntu-latest
    needs: [lint, compat]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.compat.result }}" != "success" ]; then
            echo "::error::lint or compat failed"; exit 1
          fi
